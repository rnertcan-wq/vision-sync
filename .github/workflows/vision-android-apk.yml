name: VISION Android APK

on:
  push:
    branches: [main]
    paths:
      - 'source/VISION-Android-1.5.1-source.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Verify and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source archive exists
        run: |
          test -s source/VISION-Android-1.5.1-source.zip
          unzip -t source/VISION-Android-1.5.1-source.zip

      - name: Extract Android source
        run: unzip -q source/VISION-Android-1.5.1-source.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Android source and security
        run: python3 apps/android/tools/verify_project.py

      - name: Run unit tests and build APK
        run: gradle --no-daemon --stacktrace -p apps/android clean testDebugUnitTest assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist/android
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/android/VISION-Android-1.5.1-debug.apk
          sha256sum dist/android/VISION-Android-1.5.1-debug.apk > dist/android/VISION-Android-1.5.1-debug.apk.sha256

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VISION-Android-1.5.1-debug-APK
          path: |
            dist/android/VISION-Android-1.5.1-debug.apk
            dist/android/VISION-Android-1.5.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
